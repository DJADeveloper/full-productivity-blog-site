<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#F8FAFC"/>
  
  <!-- Workflow Steps -->
  <rect x="100" y="150" width="120" height="80" rx="8" fill="#3B82F6"/>
  <text x="160" y="195" text-anchor="middle" font-family="system-ui" font-size="14" fill="white">Input</text>
  
  <path d="M220,190 L300,190" stroke="#E2E8F0" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="300" y="150" width="120" height="80" rx="8" fill="#60A5FA"/>
  <text x="360" y="195" text-anchor="middle" font-family="system-ui" font-size="14" fill="white">Process</text>
  
  <path d="M420,190 L500,190" stroke="#E2E8F0" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="500" y="150" width="120" height="80" rx="8" fill="#93C5FD"/>
  <text x="560" y="195" text-anchor="middle" font-family="system-ui" font-size="14" fill="white">Output</text>
  
  <!-- Automation Icons -->
  <circle cx="160" cy="280" r="20" fill="#A5B4FC"/>
  <path d="M150,280 L170,280 M160,270 L160,290" stroke="white" stroke-width="2"/>
  
  <circle cx="360" cy="280" r="20" fill="#A5B4FC"/>
  <path d="M350,280 L370,280 M360,270 L360,290" stroke="white" stroke-width="2"/>
  
  <circle cx="560" cy="280" r="20" fill="#A5B4FC"/>
  <path d="M550,280 L570,280 M560,270 L560,290" stroke="white" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="380" text-anchor="middle" font-family="system-ui" font-size="24" fill="#1E293B">
    Building Effective AI Workflows
  </text>
  
  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E2E8F0"/>
    </marker>
  </defs>
</svg> 