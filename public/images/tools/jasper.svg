<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#F8FAFC"/>
  
  <!-- Writing Interface -->
  <rect x="200" y="80" width="400" height="240" rx="8" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Text Editor -->
  <rect x="220" y="100" width="360" height="160" rx="4" fill="#3B82F6" fill-opacity="0.1"/>
  
  <!-- Cursor -->
  <rect x="240" y="120" width="2" height="20" fill="#3B82F6">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Generated Text -->
  <text x="250" y="135" font-family="system-ui" font-size="14" fill="#1E293B">Create engaging content that...</text>
  
  <!-- Writing Assistant Tools -->
  <rect x="220" y="280" width="80" height="24" rx="12" fill="#60A5FA"/>
  <text x="260" y="296" text-anchor="middle" font-family="system-ui" font-size="12" fill="white">Write</text>
  
  <rect x="310" y="280" width="80" height="24" rx="12" fill="#93C5FD"/>
  <text x="350" y="296" text-anchor="middle" font-family="system-ui" font-size="12" fill="white">Improve</text>
  
  <rect x="400" y="280" width="80" height="24" rx="12" fill="#A5B4FC"/>
  <text x="440" y="296" text-anchor="middle" font-family="system-ui" font-size="12" fill="white">Rephrase</text>
  
  <!-- Title -->
  <text x="400" y="380" text-anchor="middle" font-family="system-ui" font-size="24" fill="#1E293B">
    Jasper AI
  </text>
</svg> 